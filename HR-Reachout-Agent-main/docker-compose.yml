version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: hr_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hr_agent_app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./temp_files:/app/temp_files
      - ./Agents_store.json:/app/Agents_store.json
      - ./tickets_store.json:/app/tickets_store.json
      - ./leads_store.json:/app/leads_store.json
      - ./WhatsApp_Leads.xlsx:/app/WhatsApp_Leads.xlsx
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
